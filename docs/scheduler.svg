<svg xmlns="http://www.w3.org/2000/svg" width="820" height="820" viewBox="0 0 820 820" role="img" aria-labelledby="title description">
  <title id="title">Signal Kernel lazy computed scheduler</title>
  <desc id="description">Signal writes propagate invalidation and schedule affected effects. Stale computed values recompute lazily only when an effect reads them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .background { fill: #ffffff; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .node { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
      .decision { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .note { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .line { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
      .label { fill: #111827; font-family: Arial, sans-serif; font-size: 17px; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #374151; font-family: Arial, sans-serif; font-size: 15px; text-anchor: middle; }
      .group-title { fill: #334155; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <rect class="background" width="820" height="820"/>

  <rect class="node" x="290" y="24" width="240" height="54" rx="6"/>
  <text class="label" x="410" y="51">signal.set()</text>

  <path class="line" d="M410 78 V112"/>
  <rect class="node" x="235" y="112" width="350" height="60" rx="6"/>
  <text class="label" x="410" y="142">Propagate computed invalidation</text>

  <path class="line" d="M410 172 V206"/>
  <rect class="node" x="220" y="206" width="380" height="60" rx="6"/>
  <text class="label" x="410" y="236">Schedule affected effects (deduped)</text>

  <path class="line" d="M410 266 V314"/>
  <rect class="group" x="60" y="298" width="710" height="504" rx="8"/>
  <text class="group-title" x="112" y="326">Deterministic effect flush</text>

  <rect class="node" x="255" y="346" width="310" height="58" rx="6"/>
  <text class="label" x="410" y="375">Execute next effect by priority</text>

  <path class="line" d="M410 404 V438"/>
  <polygon class="decision" points="410,438 540,493 410,548 280,493"/>
  <text class="label" x="410" y="493">Reads stale computed?</text>

  <path class="line" d="M540 493 H632 V546"/>
  <text class="small" x="576" y="482">Yes</text>
  <rect class="node" x="510" y="546" width="244" height="58" rx="6"/>
  <text class="label" x="632" y="575">Recompute lazily and cache</text>

  <path class="line" d="M410 548 V604"/>
  <text class="small" x="390" y="578">No</text>
  <rect class="node" x="286" y="604" width="248" height="52" rx="6"/>
  <text class="label" x="410" y="630">Continue effect</text>

  <path class="line" d="M632 604 V630 H534"/>
  <path class="line" d="M410 656 V690"/>
  <polygon class="decision" points="410,690 528,737 410,784 292,737"/>
  <text class="label" x="410" y="737">New work generated?</text>

  <path class="line" d="M292 737 H150 V236 H220"/>
  <text class="small" x="220" y="726">Yes</text>

  <path class="line" d="M528 737 H626"/>
  <text class="small" x="574" y="726">No</text>
  <rect class="node" x="626" y="710" width="162" height="54" rx="6"/>
  <text class="label" x="707" y="737">Flush complete</text>

  <rect class="note" x="24" y="112" width="184" height="96" rx="6"/>
  <text class="small" x="116" y="142">
    <tspan x="116" dy="0">Unread computed nodes</tspan>
    <tspan x="116" dy="23">remain stale and do</tspan>
    <tspan x="116" dy="23">not perform work.</tspan>
  </text>
</svg>
